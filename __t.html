<body><pre id=o></pre><iframe id=f src="http://localhost:8765/lahore-expo-center-catering/bulk-order-calculator/?event=igatex-pakistan" width=800 height=900></iframe>
<script>
var f=document.getElementById('f'),log=[];
f.onload=function(){setTimeout(function(){
 var d=f.contentDocument,s=d.getElementById('calcEventSearch'),h=d.getElementById('calcEvent');
 log.push('preset:'+h.value+' | '+s.value);
 s.value='';s.dispatchEvent(new Event('input'));
 s.value='leather';s.dispatchEvent(new Event('input'));
 var v=[].filter.call(d.getElementById('calcEventList').children,function(l){return !l.hidden});
 log.push('leather matches:'+v.length+' list open:'+!d.getElementById('calcEventList').hidden);
 s.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true,cancelable:true}));
 log.push('picked:'+h.value+' | '+s.value);
 s.value='zzzz';s.dispatchEvent(new Event('input'));
 log.push('empty shown:'+!d.getElementById('calcEventEmpty').hidden+' value cleared:'+(h.value===''));
 document.title='DONE';document.getElementById('o').textContent=log.join('\n');
},500)};
</script>
